# FORMA do Secret do execution-service; os valores são exemplos e não funcionam. Este
# arquivo não entra no kustomization: a pipeline cria o Secret a partir dos secrets
# do GitHub Actions, que nunca tocam o repositório.
#
# Criação manual:
#   kubectl -n autogiro create secret generic execution-service-secret \
#     --from-literal=MONGODB_URL="$MONGODB_URL"
apiVersion: v1
kind: Secret
metadata:
  name: execution-service-secret
  namespace: autogiro
type: Opaque
stringData:
  # Cluster próprio no MongoDB Atlas (M0).
  MONGODB_URL: "mongodb+srv://autogiro-execution:senha@autogiro-execution.xxxxx.mongodb.net/?retryWrites=true&w=majority"
